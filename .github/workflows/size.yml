name: wasm-size

# Manual: builds the template under several size profiles and reports the published (wasm-opt) size of each,
# plus the largest functions (twiggy), so the release profile is chosen on numbers.
on:
  workflow_dispatch:
  push:
    branches: ["wasm-size"]

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  size:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            templates/familiar -> target
      - name: binaryen + twiggy
        shell: bash
        run: |
          curl -sSL https://github.com/WebAssembly/binaryen/releases/download/version_119/binaryen-version_119-x86_64-linux.tar.gz | tar xz
          cargo install twiggy --locked --quiet || true
      - name: nightly toolchain (build-std variants)
        shell: bash
        run: rustup toolchain install nightly --profile minimal --component rust-src --target wasm32-unknown-unknown
      - name: variants
        shell: bash
        run: |
          set -euo pipefail
          OPT=./binaryen-version_119/bin/wasm-opt
          FLAGS="--enable-bulk-memory --strip-debug --strip-producers --strip-target-features"
          W=templates/familiar/target/wasm32-unknown-unknown/release/familiar.wasm
          report() { printf '%-44s raw %8d  min %8d  (%.1f KiB)
' "$1" "$(stat -c%s $W)" "$(stat -c%s $2)" "$(echo "$(stat -c%s $2)/1024" | bc -l)" | tee -a sizes.txt; }
          : > sizes.txt
          cd_build() { (cd templates/familiar && "$@"); }
          # A: current profile, but keep names for twiggy
          CARGO_PROFILE_RELEASE_STRIP=false cd_build cargo build --release --target wasm32-unknown-unknown --quiet
          cp $W named.wasm
          $OPT -Oz --converge $FLAGS $W -o v_a.wasm; report "A stable s (names kept for twiggy)" v_a.wasm
          # B: nightly, std rebuilt for size (panic messages kept)
          cd_build cargo +nightly build --release --target wasm32-unknown-unknown --quiet -Z build-std=std,panic_abort -Z build-std-features=optimize_for_size
          $OPT -Oz --converge $FLAGS $W -o v_b.wasm; report "B nightly build-std optimize_for_size, s" v_b.wasm
          # C: B + opt-level z
          CARGO_PROFILE_RELEASE_OPT_LEVEL=z cd_build cargo +nightly build --release --target wasm32-unknown-unknown --quiet -Z build-std=std,panic_abort -Z build-std-features=optimize_for_size
          $OPT -Oz --converge $FLAGS $W -o v_c.wasm; report "C nightly build-std optimize_for_size, z" v_c.wasm
          # D: B + mvp-ish features off that the engine may not need
          RUSTFLAGS="-C target-cpu=mvp -C target-feature=+bulk-memory,+mutable-globals,+sign-ext" cd_build cargo +nightly build --release --target wasm32-unknown-unknown --quiet -Z build-std=std,panic_abort -Z build-std-features=optimize_for_size
          $OPT -Oz --converge $FLAGS $W -o v_d.wasm; report "D nightly build-std, s, target-cpu=mvp(+bulk)" v_d.wasm
          for f in v_*.wasm; do sha256sum $f | tee -a sizes.txt; done
          (twiggy top -n 60 named.wasm || true) > twiggy_top.txt
          (twiggy dominators -d 3 -r 80 named.wasm || true) > twiggy_dominators.txt
          (twiggy garbage named.wasm || true) | head -40 > twiggy_garbage.txt
          head -70 twiggy_top.txt
      - uses: actions/upload-artifact@v4
        with:
          name: wasm-size
          path: |
            sizes.txt
            twiggy_top.txt
            twiggy_garbage.txt
            twiggy_dominators.txt
            v_*.wasm
