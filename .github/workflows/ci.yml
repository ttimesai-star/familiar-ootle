name: ci

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  template:
    name: template wasm + clippy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      # pinned: the published template wasm (sha256 653ebb3f...) was built with rustc 1.99.1; another rustc gives
      # another hash for the same source
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.1
          targets: wasm32-unknown-unknown
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            templates/familiar -> target
            templates/tap -> target
      - name: rustfmt (template, tap, workspace)
        run: |
          (cd templates/familiar && cargo fmt --check)
          (cd templates/tap && cargo fmt --check)
          cargo fmt --all --check
      - name: build template (release wasm)
        working-directory: templates/familiar
        run: cargo build --release --target wasm32-unknown-unknown
      - name: wasm-opt (strip custom sections, as the engine requires for a raw publish)
        run: |
          curl -sSL https://github.com/WebAssembly/binaryen/releases/download/version_119/binaryen-version_119-x86_64-linux.tar.gz | tar xz
          ./binaryen-version_119/bin/wasm-opt -Oz --enable-bulk-memory --strip-debug --strip-producers --strip-target-features             templates/familiar/target/wasm32-unknown-unknown/release/familiar.wasm -o familiar.min.wasm
          ls -l templates/familiar/target/wasm32-unknown-unknown/release/familiar.wasm familiar.min.wasm
          sha256sum familiar.min.wasm
      - uses: actions/upload-artifact@v4
        with:
          name: familiar-wasm
          path: familiar.min.wasm
      - name: clippy (wasm)
        working-directory: templates/familiar
        run: cargo clippy --target wasm32-unknown-unknown -- -D warnings
      - name: build the tTARI tap (release wasm) + clippy
        working-directory: templates/tap
        run: |
          cargo build --release --target wasm32-unknown-unknown
          cargo clippy --target wasm32-unknown-unknown -- -D warnings
      - name: wasm-opt the tap
        run: |
          ./binaryen-version_119/bin/wasm-opt -Oz --enable-bulk-memory --strip-debug --strip-producers --strip-target-features templates/tap/target/wasm32-unknown-unknown/release/familiar_tap.wasm -o familiar_tap.min.wasm
          sha256sum familiar_tap.min.wasm
      - uses: actions/upload-artifact@v4
        with:
          name: tap-wasm
          path: familiar_tap.min.wasm

  client:
    name: esmeralda client builds
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: client
      - name: cargo build -p familiar-cli
        shell: bash
        run: cargo build -p familiar-cli 2>&1 | tee client.log
      - name: cargo test -p familiar-cli (the obedient agent's parser)
        shell: bash
        run: cargo test -p familiar-cli 2>&1 | tee -a client.log
      - name: observer script parses
        run: python3 -m py_compile scripts/observer_view.py
      - name: MCP server tests (pay_through_leash, stand-in client)
        run: python3 -m unittest scripts/tests/test_familiar_mcp.py -v
      - name: upload log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: client-log
          path: client.log

  engine-tests:
    name: engine tests (in-process Ootle engine)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
          cache-directories: |
            templates/familiar/target
            templates/test_faucet/target
            templates/mallory/target
            templates/tap/target
      - name: free disk
        run: df -h /
      - name: cargo test
        shell: bash
        run: /usr/bin/time -v cargo test -p familiar-tests -p familiar_core --tests -- --nocapture --test-threads=2 2>&1 | tee test.log
      - name: upload Cargo.lock and log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lock-and-log
          path: |
            Cargo.lock
            test.log
