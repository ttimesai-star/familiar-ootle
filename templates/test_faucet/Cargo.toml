[workspace]

[package]
name = "test_faucet"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Test-only stealth resource faucet for the Familiar engine tests (never published)"
publish = false

[dependencies]
tari_template_lib = "0.34"

[lib]
crate-type = ["cdylib"]

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
