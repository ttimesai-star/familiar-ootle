[workspace]

[package]
name = "familiar_tap"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "A small tTARI tap so anyone can try Familiar on the Esmeralda testnet"

[dependencies]
tari_template_lib = "0.34"

[lib]
crate-type = ["cdylib"]

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
