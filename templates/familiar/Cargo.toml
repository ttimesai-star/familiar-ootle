[workspace]

[package]
name = "familiar"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Familiar: a private, network-enforced allowance for AI agents on Tari Ootle"

[dependencies]
tari_template_lib = "0.34"

[lib]
crate-type = ["cdylib"]

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
