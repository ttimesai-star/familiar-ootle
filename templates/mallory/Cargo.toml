[workspace]

[package]
name = "mallory"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Test-only hostile component: tries to spend leash UTXOs from its own frame. Never published."
publish = false

[dependencies]
tari_template_lib = "0.34"

[lib]
crate-type = ["cdylib"]

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
